name: Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Determine if version changed
        id: check_version
        env:
          BEFORE_SHA:
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event.before }}
        run: |
          ./scripts/check-version-changed.sh

      - name: Setup Git LFS
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          git lfs install
          git lfs pull

      - name: Build package with caching
        if: steps.check_version.outputs.should_release == 'true'
        uses: ./.github/actions/npm-install-build-and-cache

      - name: Configure Git
        if: steps.check_version.outputs.should_release == 'true'
        run: |
          git config --local user.email "release-action@github.com"
          git config --local user.name "GitHub Release Action"

      - name: Release if version changed
        if: steps.check_version.outputs.should_release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          ./scripts/release-new-version.sh
